<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My TV Channel Guide</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --gutter: 1.25rem;
  --chan-col: 13rem;
  --bg: #ffffff;
  --text: #111111;
  --muted: #5c5c5c;
  --rule: #c8c8c8;
  --channel-bg: #eeeeee;
  --cell-bg: #ffffff;
  --cell-hover: #eaf3ff;
  --sub: #1f6fb8;
  --today: #1a7f37;
  --accent: #0a4fa0;
  --focus: #d62828;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --text: #ffffff;
    --muted: #9a9a9a;
    --rule: #333333;
    --channel-bg: #161616;
    --cell-bg: #050505;
    --cell-hover: #1a1a1a;
    --sub: #4aa3e8;
    --today: #3ddc5c;
    --accent: #ffd23f;
    --focus: #ff8c42;
  }
}
:root[data-theme="dark"] {
  --bg: #000000;
  --text: #ffffff;
  --muted: #9a9a9a;
  --rule: #333333;
  --channel-bg: #161616;
  --cell-bg: #050505;
  --cell-hover: #1a1a1a;
  --sub: #4aa3e8;
  --today: #3ddc5c;
  --accent: #ffd23f;
  --focus: #ff8c42;
}

html {
  font-size: calc(16px * var(--scale, 1));
  -webkit-text-size-adjust: 100%;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  line-height: 1.3;
  min-height: 100vh;
}

.top {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 0.75rem 1.5rem;
  padding: 1rem var(--gutter);
  border-bottom: 1px solid var(--rule);
}
